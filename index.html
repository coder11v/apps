<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViB Suite | Dashboard</title>
    <!-- Access Control Check -->
    <script>
        (function () {
            const isFromApp = navigator.userAgent.includes('ViBSuite');
            const isBypassed = localStorage.getItem('vib_bypass') === 'true';
            const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

            // Allow access if from app OR if bypassed OR if we are already on /download (to avoid loops)
            if (!isFromApp && !isBypassed && !isLocalhost && !window.location.pathname.startsWith('/download')) {
                window.location.href = '/download';
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #030303;
            --card-bg: rgba(20, 20, 20, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-primary: #00ff88;
            --accent-secondary: #00d2ff;
            --banana-primary: #f7d046;
            --banana-secondary: #e6b800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 210, 255, 0.05) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-app-region: drag;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 24px;
            width: 100%;
            -webkit-app-region: no-drag;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3rem, 8vw, 4.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.25rem;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: fadeInUp 0.6s ease-out both;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background: rgba(30, 30, 30, 0.8);
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.05), transparent);
            pointer-events: none;
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
        }

        .card-content h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            font-family: 'Outfit', sans-serif;
        }

        .card-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .badge {
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 99px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid currentColor;
        }

        .badge-beta {
            color: #facc15;
        }

        .badge-live {
            color: #4ade80;
        }

        .badge-soon {
            color: #60a5fa;
        }

        .btn {
            background: #ffffff;
            color: #000;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #e5e5e5;
        }

        .btn-banana {
            background: linear-gradient(135deg, var(--banana-primary), var(--banana-secondary));
            color: #000;
        }

        .btn-banana:hover {
            box-shadow: 0 0 20px rgba(247, 208, 70, 0.3);
        }

        /* Access indicators */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-dot.online {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-dot.offline {
            background: #f87171;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 16px;
            }

            header {
                margin-bottom: 40px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>ViB Suite</h1>
            <p class="subtitle">A curated collection of productivity tools and creative experiments.</p>
        </header>

        <div class="dashboard-grid">
            <!-- Cards will be dynamically loaded here -->
        </div>

        <script>
            async function loadCards() {
                try {
                    const response = await fetch('cards.json');
                    const cards = await response.json();
                    const grid = document.querySelector('.dashboard-grid');
                    grid.innerHTML = ''; 

                    cards.forEach((card, index) => {
                        const cardElement = document.createElement('div');
                        cardElement.className = 'card';
                        cardElement.style.animationDelay = `${(index + 1) * 0.1}s`;
                        
                        if (card.theme_color) {
                            cardElement.style.borderColor = card.theme_color;
                        }
                        
                        if (!card.is_active) {
                            cardElement.style.opacity = '0.6';
                        }

                        const iconStyle = card.icon_bg ? `style="background: ${card.icon_bg};"` : '';
                        const link = card.external_link || card.local_path || '#';
                        const btnClass = card.title === 'Banana Ballers' ? 'btn btn-banana' : 'btn';
                        const pointerEvents = card.is_active ? '' : 'style="pointer-events: none; opacity: 0.5;"';

                        cardElement.innerHTML = `
                            <div class="card-icon" ${iconStyle}>
                                ${card.lucide_icon ? `<i data-lucide="${card.lucide_icon}"></i>` : card.emoji}
                            </div>
                            <div class="card-content">
                                <h2>${card.title}</h2>
                                <p class="card-description">${card.description}</p>
                            </div>
                            <div class="card-footer">
                                <span class="badge ${card.badge_class}">
                                    ${card.status === 'Active' ? '<span class="status-dot online"></span>' : ''}${card.status}
                                </span>
                                <a href="${link}" class="${btnClass}" ${pointerEvents}>${card.button_text || 'Open'}</a>
                            </div>
                        `;
                        grid.appendChild(cardElement);
                    });

                    // Initialize Lucide icons
                    lucide.createIcons();
                } catch (error) {
                    console.error('Error loading cards:', error);
                    // Fallback to error message if fetch fails
                    document.querySelector('.dashboard-grid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">Failed to load dashboard components. Please try again later.</p>';
                }
            }
            window.addEventListener('DOMContentLoaded', loadCards);
        </script>

        <footer>
            <p>&copy; 2026 ViB Suite. Built for the modern workspace.</p>
        </footer>
    </div>
</body>

</html>
