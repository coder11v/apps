<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Detective</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            background: #e2e8f0;
            height: 0.5rem;
            border-radius: 0.5rem;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -0.25rem;
            background-color: #4f46e5;
            height: 1rem;
            width: 1rem;
            border-radius: 50%;
        }

        .vertical-slider {
            transform: rotate(-90deg);
            width: 100px;
        }

        canvas {
            touch-action: none;
        }
    </style>
</head>

<body class="bg-slate-50 font-sans text-slate-800 overflow-hidden h-screen flex flex-col">

    <!-- Header -->
    <header class="p-4 bg-white border-b flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <i data-lucide="search" size="20"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-indigo-900">Doodle Detective</h1>
        </div>
        <div class="flex items-center gap-2">
            <!-- Model Selector -->
            <select id="modelSelector"
                class="text-xs font-bold border rounded-full px-3 py-1 bg-slate-50 border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="gemini">Gemini 2.5 Flash</option>
                <option value="gpt">GPT-4o (Vision)</option>
                <option value="claude">Claude 3.5 Sonnet</option>
            </select>

            <button id="toggleSettings" class="p-2 rounded-full transition-colors hover:bg-slate-100 text-slate-600"
                title="API Settings">
                <i data-lucide="settings" size="20"></i>
            </button>
            <button id="toggleHistory" class="p-2 rounded-full transition-colors hover:bg-slate-100 text-slate-600">
                <i data-lucide="history" size="20"></i>
            </button>
            <div class="h-6 w-px bg-slate-200 mx-1"></div>
            <p class="text-xs text-slate-400 hidden sm:block">Made by ViB</p>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden relative">
        <!-- Left Toolbar -->
        <div class="w-16 md:w-20 bg-white border-r flex flex-col items-center py-6 gap-6 z-10 shadow-sm">
            <div class="flex flex-col gap-2">
                <button id="penBtn" class="p-3 rounded-xl transition-all bg-indigo-600 text-white shadow-lg"
                    title="Pen">
                    <i data-lucide="pencil" size="24"></i>
                </button>
                <button id="eraserBtn" class="p-3 rounded-xl transition-all text-slate-400 hover:bg-slate-100"
                    title="Eraser">
                    <i data-lucide="eraser" size="24"></i>
                </button>
            </div>

            <div class="h-px w-8 bg-slate-200"></div>

            <div class="flex flex-col gap-4 items-center">
                <input type="color" id="colorPicker" value="#000000"
                    class="w-10 h-10 rounded-full cursor-pointer border-2 border-slate-100 overflow-hidden">
                <div class="flex flex-col items-center gap-8 mt-4">
                    <span class="text-[10px] font-bold text-slate-400 uppercase">Size</span>
                    <input type="range" id="sizePicker" min="1" max="30" value="5"
                        class="vertical-slider accent-indigo-600">
                </div>
            </div>

            <div class="mt-auto flex flex-col gap-2">
                <button id="clearBtn"
                    class="p-3 text-slate-400 hover:bg-red-50 hover:text-red-500 rounded-xl transition-all"
                    title="Clear Canvas">
                    <i data-lucide="trash-2" size="24"></i>
                </button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="flex-1 flex flex-col relative bg-slate-100 p-4 md:p-8">
            <div id="canvasContainer"
                class="flex-1 bg-white rounded-3xl shadow-2xl relative overflow-hidden ring-1 ring-slate-200">
                <canvas id="mainCanvas" class="w-full h-full cursor-crosshair"></canvas>

                <!-- Prediction Overlay -->
                <div id="predictionBox"
                    class="hidden absolute top-6 left-6 right-6 max-w-md mx-auto animate-fade-in z-20">
                    <div id="predictionContent"
                        class="p-4 rounded-2xl shadow-xl border backdrop-blur-md flex items-start gap-4 bg-indigo-900/90 border-indigo-700 text-white">
                        <i data-lucide="sparkles" id="predictionIcon" class="text-yellow-400 flex-shrink-0"
                            size="24"></i>
                        <div>
                            <h3 id="predictionTitle" class="font-bold text-lg mb-1">Gemini says...</h3>
                            <p id="predictionText" class="text-sm opacity-90 leading-relaxed"></p>
                        </div>
                        <button id="closePrediction" class="ml-auto opacity-50 hover:opacity-100">
                            <i data-lucide="x" size="20"></i>
                        </button>
                    </div>
                </div>

                <!-- CTA Button -->
                <div class="absolute bottom-8 left-0 right-0 flex justify-center pointer-events-none">
                    <button id="analyzeBtn"
                        class="group pointer-events-auto flex items-center gap-3 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-full font-bold shadow-xl transition-all transform hover:scale-105 active:scale-95 disabled:bg-slate-400 disabled:scale-100">
                        <span id="btnIcon"><i data-lucide="search" size="20"></i></span>
                        <span id="btnText">What did I draw?</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsPanel"
            class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
            <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden animate-fade-in">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-slate-800">API Settings</h2>
                        <button id="closeSettings" class="text-slate-400 hover:text-slate-600"><i data-lucide="x"
                                size="20"></i></button>
                    </div>
                    <p class="text-xs text-slate-500 mb-4 font-medium uppercase tracking-wider">Configure your AI Brains
                    </p>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Gemini API Key</label>
                            <input type="password" id="geminiKey" placeholder="Enter key if not auto-provided"
                                class="w-full border rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">OpenAI API Key (for
                                GPT-4o)</label>
                            <input type="password" id="openaiKey" placeholder="sk-..."
                                class="w-full border rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Anthropic API Key (for
                                Claude)</label>
                            <input type="password" id="claudeKey" placeholder="sk-ant-..."
                                class="w-full border rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                    <div class="mt-6 p-3 bg-indigo-50 border border-indigo-100 rounded-xl">
                        <p class="text-[10px] text-indigo-600 leading-tight">If Gemini is already provided by the
                            environment, your custom key will be ignored unless the system key fails.</p>
                    </div>
                    <button id="saveSettings"
                        class="w-full mt-6 bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700">Save
                        Config</button>
                </div>
            </div>
        </div>

        <!-- History Sidebar -->
        <div id="historySidebar" class="hidden w-64 bg-white border-l shadow-2xl flex flex-col z-20">
            <div class="p-4 border-b flex items-center justify-between bg-slate-50">
                <h2 class="font-bold text-slate-700 flex items-center gap-2">
                    <i data-lucide="history" size="16"></i> History
                </h2>
                <button id="closeHistory" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="chevron-right" size="20"></i>
                </button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto p-3 space-y-4">
                <div class="text-center py-10 px-4">
                    <p class="text-sm text-slate-400 italic">No doodles investigated yet!</p>
                </div>
            </div>
        </div>
    </main>

    <footer
        class="bg-white border-t p-2 px-6 flex justify-between items-center text-[10px] text-slate-400 uppercase tracking-widest font-bold">
        <span>Made by ViB</span>
        <div class="flex gap-4">
            <span class="flex items-center gap-1">
                <div class="w-2 h-2 rounded-full bg-green-500"></div> System Status: Optimal
            </span>
        </div>
    </footer>

    <script>
        // Initialization
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const systemGeminiKey = ""; // Environment provided

        let isDrawing = false;
        let isEraser = false;
        let color = '#000000';
        let lineWidth = 5;
        let history = [];

        // App state for models
        const config = {
            gemini: localStorage.getItem('geminiKey') || '',
            openai: localStorage.getItem('openaiKey') || '',
            claude: localStorage.getItem('claudeKey') || ''
        };

        // Setup Canvas Size
        function resizeCanvas() {
            const tempImage = canvas.toDataURL();
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = tempImage;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getXY(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            isDrawing = true;
            const { x, y } = getXY(e);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.strokeStyle = isEraser ? 'white' : color;
            ctx.lineWidth = lineWidth;
        }

        function draw(e) {
            if (!isDrawing) return;
            const { x, y } = getXY(e);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function stopDrawing() { isDrawing = false; ctx.closePath(); }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
        canvas.addEventListener('touchend', stopDrawing);

        // Tool Controls
        document.getElementById('penBtn').addEventListener('click', () => {
            isEraser = false;
            document.getElementById('penBtn').className = 'p-3 rounded-xl transition-all bg-indigo-600 text-white shadow-lg';
            document.getElementById('eraserBtn').className = 'p-3 rounded-xl transition-all text-slate-400 hover:bg-slate-100';
        });

        document.getElementById('eraserBtn').addEventListener('click', () => {
            isEraser = true;
            document.getElementById('eraserBtn').className = 'p-3 rounded-xl transition-all bg-indigo-600 text-white shadow-lg';
            document.getElementById('penBtn').className = 'p-3 rounded-xl transition-all text-slate-400 hover:bg-slate-100';
        });

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            color = e.target.value;
            if (isEraser) document.getElementById('penBtn').click();
        });

        document.getElementById('sizePicker').addEventListener('input', (e) => { lineWidth = e.target.value; });
        document.getElementById('clearBtn').addEventListener('click', () => {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('predictionBox').classList.add('hidden');
        });

        // Modals & Panels
        const sidebar = document.getElementById('historySidebar');
        const settings = document.getElementById('settingsPanel');
        document.getElementById('toggleHistory').addEventListener('click', () => sidebar.classList.toggle('hidden'));
        document.getElementById('closeHistory').addEventListener('click', () => sidebar.classList.add('hidden'));
        document.getElementById('toggleSettings').addEventListener('click', () => {
            document.getElementById('geminiKey').value = config.gemini;
            document.getElementById('openaiKey').value = config.openai;
            document.getElementById('claudeKey').value = config.claude;
            settings.classList.remove('hidden');
        });
        document.getElementById('closeSettings').addEventListener('click', () => settings.classList.add('hidden'));
        document.getElementById('saveSettings').addEventListener('click', () => {
            config.gemini = document.getElementById('geminiKey').value;
            config.openai = document.getElementById('openaiKey').value;
            config.claude = document.getElementById('claudeKey').value;
            localStorage.setItem('geminiKey', config.gemini);
            localStorage.setItem('openaiKey', config.openai);
            localStorage.setItem('claudeKey', config.claude);
            settings.classList.add('hidden');
        });
        document.getElementById('closePrediction').addEventListener('click', () => document.getElementById('predictionBox').classList.add('hidden'));

        const PROMPT = "Identify this simple hand-drawn doodle. Be concise. Reply with just the name of the object (e.g., 'A cat', 'A lighthouse') and a very short 1-sentence whimsical description of why you think it is that.";

        // Model API Calls
        async function callGemini(base64) {
            const activeKey = systemGeminiKey || config.gemini;
            if (!activeKey) throw new Error("Missing Gemini API Key. Please provide one in settings.");

            const payload = {
                contents: [{ role: "user", parts: [{ text: PROMPT }, { inlineData: { mimeType: "image/png", data: base64.split(',')[1] } }] }]
            };
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            return data.candidates?.[0]?.content?.parts?.[0]?.text;
        }

        async function callGPT(base64) {
            if (!config.openai) throw new Error("Missing OpenAI Key");
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.openai}` },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [{
                        role: "user",
                        content: [{ type: "text", text: PROMPT }, { type: "image_url", image_url: { url: base64 } }]
                    }]
                })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            return data.choices?.[0]?.message?.content;
        }

        async function callClaude(base64) {
            if (!config.claude) throw new Error("Missing Anthropic Key");
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': config.claude,
                    'anthropic-version': '2023-06-01',
                    'dangerously-allow-browser': 'true'
                },
                body: JSON.stringify({
                    model: "claude-3-5-sonnet-20240620",
                    max_tokens: 500,
                    messages: [{
                        role: "user",
                        content: [
                            { type: "image", source: { type: "base64", media_type: "image/png", data: base64.split(',')[1] } },
                            { type: "text", text: PROMPT }
                        ]
                    }]
                })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            return data.content?.[0]?.text;
        }

        // Action
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const btn = document.getElementById('analyzeBtn');
            const btnText = document.getElementById('btnText');
            const box = document.getElementById('predictionBox');
            const textEl = document.getElementById('predictionText');
            const titleEl = document.getElementById('predictionTitle');
            const modelType = document.getElementById('modelSelector').value;

            btn.disabled = true;
            btnText.innerText = 'Analyzing...';

            try {
                const base64 = canvas.toDataURL('image/png');
                let resultText = "";

                if (modelType === 'gemini') {
                    resultText = await callGemini(base64);
                } else if (modelType === 'gpt') {
                    resultText = await callGPT(base64);
                } else if (modelType === 'claude') {
                    resultText = await callClaude(base64);
                }

                box.classList.remove('hidden');
                titleEl.innerText = `${modelType.toUpperCase()} says...`;
                textEl.innerText = resultText || "Stumped!";

                const item = { id: Date.now(), text: resultText, img: base64, time: new Date().toLocaleTimeString(), model: modelType };
                history.unshift(item);
                updateHistoryUI();
            } catch (err) {
                box.classList.remove('hidden');
                titleEl.innerText = "Error";
                textEl.innerText = err.message || "Failed to contact AI.";
                document.getElementById('predictionContent').className = "p-4 rounded-2xl shadow-xl border backdrop-blur-md flex items-start gap-4 bg-red-900/90 border-red-700 text-white";
            } finally {
                btn.disabled = false;
                btnText.innerText = 'What did I draw?';
            }
        });

        function updateHistoryUI() {
            const list = document.getElementById('historyList');
            if (history.length === 0) return;
            list.innerHTML = history.slice(0, 10).map(item => `
                <div class="border rounded-xl overflow-hidden hover:border-indigo-300 transition-colors shadow-sm bg-white">
                    <div class="aspect-square bg-slate-50 p-2 border-b"><img src="${item.img}" class="w-full h-full object-contain mix-blend-multiply" /></div>
                    <div class="p-3">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] text-indigo-500 font-bold uppercase">${item.model}</span>
                            <span class="text-[10px] text-slate-400">${item.time}</span>
                        </div>
                        <p class="text-xs font-medium text-slate-700 leading-tight">${item.text}</p>
                    </div>
                </div>
            `).join('');
        }

        lucide.createIcons();
    </script>
</body>

</html>
